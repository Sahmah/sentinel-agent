name: Release

# Push a tag like v0.2.0 (matching `version` in pyproject.toml) to publish a GitHub Release.
# Run it by hand (Actions > Release > Run workflow) for a dry run: everything but publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm install -g npm@11
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v6
      - name: Build the Python package, with the dashboard bundled
        run: |
          cp -r frontend/build src/sentinel_agent/dashboard
          uv build
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          (cd frontend/build && zip -qr "../../dist/sentinel-dashboard-$version.zip" .)
          ls -l dist

      # Install the wheel alone, outside the repo, and check it serves the dashboard and API.
      - name: Smoke-test the wheel
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
          cd "$RUNNER_TEMP"
          uv run --python 3.12 --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl \
            sentinel serve --port 8123 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8123/api/summary > /dev/null && break; sleep 1; done
          curl -sf localhost:8123/api/summary
          curl -sf localhost:8123/ | grep -q "_app/immutable" || { cat serve.log; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sentinel Agent $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
